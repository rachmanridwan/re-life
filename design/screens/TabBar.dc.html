<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width:390px;height:84px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #E4E4E0;background:#FFFFFF;padding:8px 8px 20px;font-family:Inter,sans-serif">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
    <a href="{{t.href}}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;font-size:11px;text-decoration:none;font-weight:{{t.weight}};color:{{t.fg}}">
      <dc-import name="Icon" icon="{{t.icon}}" size="22" color="{{t.fg}}" hint-size="22px,22px"></dc-import>
      {{t.label}}
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"status","options":["status","log","quests","treasury"]},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'status';
    const tabs = [
      ['status', 'Status', 'Main.dc.html'], ['log', 'Log', 'Log.dc.html'],
      ['quests', 'Quests', 'Quests.dc.html'], ['treasury', 'Treasury', 'Treasury.dc.html']
    ].map(([id, label, href]) => ({ icon: id, label, href, fg: a === id ? '#111113' : '#6B6B73', weight: a === id ? 600 : 500 }));
    return { tabs };
  }
}
</script>
</body>
</html>

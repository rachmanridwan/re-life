<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#111113;font-family:Inter,sans-serif;color:#F5F5F2;display:flex;flex-direction:column;gap:20px;padding:16px 20px 28px">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="Quests.dc.html" aria-label="Leave focus" style="width:44px;height:44px;border-radius:12px;background:#1C1C22;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="back" size="20" color="#F5F5F2" hint-size="20px,20px"></dc-import></a>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px">Focus run</span>
  </div>

  <div style="display:flex;gap:8px">
    <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:#1C1C22"><dc-import name="Icon" icon="code" size="16" color="#C7CBFF" hint-size="16px,16px"></dc-import>Programming</span>
    <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:#1C1C22"><dc-import name="Icon" icon="timer" size="16" color="#C7CBFF" hint-size="16px,16px"></dc-import>50 min</span>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;position:relative">
    <svg width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="31 of 50 minutes done">
      <circle cx="130" cy="130" r="112" fill="none" stroke="#26262E" stroke-width="14"/>
      <circle cx="130" cy="130" r="112" fill="none" stroke="#818CF8" stroke-width="14" stroke-linecap="round" stroke-dasharray="437 704" transform="rotate(-90 130 130)"/>
    </svg>
    <div style="position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:52px">18:42</span>
      <span style="font-size:13px;color:#A1A1AA">{{stateLabel}}</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#1C1C22">
      <dc-import name="Icon" icon="shield" size="18" color="#86EFAC" hint-size="18px,18px"></dc-import>
      <span style="flex:1;font-size:13px">No app switching detected</span>
      <span style="font-size:12px;color:#A1A1AA">Verified</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#1C1C22">
      <dc-import name="Icon" icon="sparkle" size="18" color="#C7CBFF" hint-size="18px,18px"></dc-import>
      <span style="flex:1;font-size:13px">On finish: Focus +50 XP → INT, WIL day</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <button onClick="{{toggle}}" style="min-height:52px;border-radius:16px;border:1px solid #3F3F46;background:transparent;color:#F5F5F2;display:flex;align-items:center;justify-content:center;gap:8px;font-family:Inter,sans-serif;font-size:15px;font-weight:600;cursor:pointer"><dc-import name="Icon" icon="{{toggleIcon}}" size="18" color="#F5F5F2" hint-size="18px,18px"></dc-import>{{toggleLabel}}</button>
    <a href="Log.dc.html" style="min-height:52px;border-radius:16px;background:#F5F5F2;color:#111113;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">End session</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { paused: false }; }
  renderVals() {
    const p = this.state.paused;
    return { stateLabel: p ? 'Paused' : 'remaining', toggleIcon: p ? 'play' : 'pause', toggleLabel: p ? 'Resume' : 'Pause', toggle: () => this.setState({ paused: !p }) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Credential vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F2}
a{color:inherit;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="width:390px;min-height:900px;box-sizing:border-box;background:#F5F5F2;font-family:Inter,sans-serif;color:#111113;display:flex;flex-direction:column;gap:12px;padding:16px 16px 24px">
  <div style="display:flex;align-items:center;gap:8px">
    <a href="Settings.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:12px;border:1px solid #E4E4E0;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="back" size="20" hint-size="20px,20px"></dc-import></a>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px">Credential vault</span>
  </div>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
    <p style="margin:0;font-size:13px;line-height:1.5;color:#3F3F46">Credentials only add to INT and DEX, up to +10 each. You can reach 99 without any.</p>
    <sc-for list="{{bonus}}" as="b" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px"><dc-import name="Icon" icon="{{b.icon}}" size="16" color="#115E59" hint-size="16px,16px"></dc-import><span style="flex:1;font-weight:600">{{b.name}} bonus</span><span style="font-family:'JetBrains Mono',monospace">{{b.val}} / +10</span></div>
        <div style="height:6px;border-radius:999px;background:#ECECE8;overflow:hidden"><div style="width:{{b.pct}};height:100%;background:#0F766E"></div></div>
      </div>
    </sc-for>
  </section>

  <sc-for list="{{creds}}" as="c" hint-placeholder-count="3">
    <div style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center">
      <span style="width:44px;height:44px;border-radius:12px;background:#F5F5F2;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="{{c.icon}}" size="22" hint-size="22px,22px"></dc-import></span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:14px;font-weight:600">{{c.name}}</span>
        <span style="font-size:12px;color:#5E5E66">{{c.meta}}</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span style="font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:{{c.tagBg}};color:{{c.tagFg}}">{{c.tag}}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#115E59">{{c.bonus}}</span>
      </div>
    </div>
  </sc-for>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
    <button style="min-height:72px;border-radius:16px;border:1px dashed #C8C8C2;background:#FFFFFF;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#111113"><dc-import name="Icon" icon="git" size="20" hint-size="20px,20px"></dc-import>Paste verify link</button>
    <button style="min-height:72px;border-radius:16px;border:1px dashed #C8C8C2;background:#FFFFFF;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#111113"><dc-import name="Icon" icon="camera" size="20" hint-size="20px,20px"></dc-import>Upload certificate</button>
  </div>
  <span style="font-size:12px;color:#5E5E66;text-align:center">Link-verified counts now. Photo uploads count at half until reviewed.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const bonus = [{ icon: 'int', name: 'INT', val: '+4', pct: '40%' }, { icon: 'dex', name: 'DEX', val: '+3', pct: '30%' }];
    const ok = { tag: 'Verified', tagBg: '#ECFDF3', tagFg: '#166534' };
    const creds = [
      { icon: 'award', name: 'Dicoding · Backend Developer', meta: 'Checked via certificate link · Oct 2026', bonus: '+3 DEX', ...ok },
      { icon: 'language', name: 'English test · CEFR B1', meta: 'Score report link · Jul 2026', bonus: '+4 INT', ...ok },
      { icon: 'cloud', name: 'Cloud associate cert', meta: 'Photo upload · in review', bonus: '+0', tag: 'Pending', tagBg: '#FEF3C7', tagFg: '#92400E' }
    ];
    return { bonus, creds };
  }
}
</script>
</body>
</html>

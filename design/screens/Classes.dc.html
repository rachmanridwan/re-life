<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classes and build planner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F2}
a{color:inherit;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="width:390px;min-height:1100px;box-sizing:border-box;background:#F5F5F2;font-family:Inter,sans-serif;color:#111113;display:flex;flex-direction:column;gap:12px;padding:16px 16px 24px">
  <div style="display:flex;align-items:center;gap:8px">
    <a href="Main.dc.html" aria-label="Back to status" style="width:44px;height:44px;border-radius:12px;border:1px solid #E4E4E0;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="back" size="20" hint-size="20px,20px"></dc-import></a>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px">Classes</span>
  </div>

  <section style="background:#111113;color:#F5F5F2;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:14px;background:#4338CA;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="code" size="24" color="#FFFFFF" hint-size="24px,24px"></dc-import></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#A1A1AA">Main class · Craft</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px">Grinder Builder</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px">
      <sc-for list="{{ranks}}" as="r" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div style="width:100%;height:6px;border-radius:3px;background:{{r.bar}}"></div>
          <span style="font-size:10px;text-align:center;color:{{r.fg}};font-weight:{{r.w}}">{{r.name}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:8px"><dc-import name="Icon" icon="target" size="18" color="#4338CA" hint-size="18px,18px"></dc-import><h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;flex:1">Next rank: Locked In Builder</h2></div>
    <sc-for list="{{reqs}}" as="q" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px">
          <dc-import name="Icon" icon="{{q.icon}}" size="16" hint-size="16px,16px"></dc-import>
          <span style="flex:1;font-weight:500">{{q.name}}</span>
          <span style="font-family:'JetBrains Mono',monospace;color:{{q.fg}}">{{q.val}}</span>
          <sc-if value="{{q.done}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="check" size="16" color="#166534" hint-size="16px,16px"></dc-import></sc-if>
        </div>
        <div style="height:6px;border-radius:999px;background:#ECECE8;overflow:hidden"><div style="width:{{q.pct}};height:100%;background:{{q.bar}}"></div></div>
      </div>
    </sc-for>
    <a href="Quests.dc.html" style="min-height:44px;border-radius:12px;background:#F2F3FF;color:#3730A3;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600"><dc-import name="Icon" icon="quests" size="16" color="#3730A3" hint-size="16px,16px"></dc-import>Add WIL quests to my board</a>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px">Class families</h2>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{fams}}" as="f" hint-placeholder-count="8">
        <div style="padding:12px;border-radius:14px;border:1px solid {{f.border}};background:{{f.bg}};display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><dc-import name="Icon" icon="{{f.icon}}" size="20" color="{{f.fg}}" hint-size="20px,20px"></dc-import><sc-if value="{{f.locked}}" hint-placeholder-val="{{ true }}"><dc-import name="Icon" icon="lock" size="14" color="#8A8A92" hint-size="14px,14px"></dc-import></sc-if></div>
          <span style="font-size:14px;font-weight:600;color:{{f.fg}}">{{f.name}}</span>
          <span style="font-size:11px;color:#5E5E66">{{f.meta}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size:12px;color:#5E5E66">You can hold several classes. Pick which one shows as main.</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Rookie', 'Grinder', 'Locked In', 'Cracked', 'Goated', 'Legend'];
    const ranks = names.map((name, i) => ({ name, bar: i <= 1 ? '#818CF8' : '#3F3F46', fg: i === 1 ? '#FFFFFF' : '#A1A1AA', w: i === 1 ? 700 : 500 }));
    const reqs = [
      { icon: 'code', name: 'Programming Lv 50', val: '49 / 50', pct: '98%', done: false, fg: '#111113', bar: '#111113' },
      { icon: 'dex', name: 'DEX 60', val: '66 / 60', pct: '100%', done: true, fg: '#166534', bar: '#16A34A' },
      { icon: 'wil', name: 'WIL 50', val: '41 / 50', pct: '82%', done: false, fg: '#B45309', bar: '#D97706' }
    ];
    const own = { bg: '#F2F3FF', border: '#C7CBFF', fg: '#111113', locked: false };
    const lock = { bg: '#FFFFFF', border: '#ECECE8', fg: '#5E5E66', locked: true };
    const fams = [
      { icon: 'dex', name: 'Builder', meta: 'Craft · programming', ...own },
      { icon: 'running', name: 'Runner', meta: 'Body · endurance', ...own },
      { icon: 'str', name: 'Lifter', meta: 'Body · strength', ...lock },
      { icon: 'language', name: 'Polyglot', meta: 'Mind · languages', ...lock },
      { icon: 'design', name: 'Creator', meta: 'Craft · design, music', ...lock },
      { icon: 'int', name: 'Coach', meta: 'Hybrid · body + mind', ...lock },
      { icon: 'sparkle', name: 'Founder', meta: 'Hybrid · mind + craft', ...lock },
      { icon: 'star', name: 'Main Character', meta: 'All six balanced, 50+', ...lock }
    ];
    return { ranks, reqs, fams };
  }
}
</script>
</body>
</html>

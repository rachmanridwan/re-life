<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Training hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;min-height:1080px;box-sizing:border-box;background:#111113;font-family:Inter,sans-serif;color:#F5F5F2;display:flex;flex-direction:column;gap:16px;padding:20px 20px 28px">
  <div style="display:flex;align-items:center;gap:8px">
    <a href="Main.dc.html" aria-label="Back to status" style="width:44px;height:44px;border-radius:12px;background:#1C1C22;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="back" size="20" color="#F5F5F2" hint-size="20px,20px"></dc-import></a>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;flex:1">Training</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#A1A1AA">3 / 6 · ~5 min left</span>
  </div>

  <div style="height:6px;border-radius:999px;background:#26262E;overflow:hidden"><div style="width:50%;height:100%;background:#818CF8"></div></div>

  <div style="border-radius:18px;padding:14px 16px;background:#1C1C22;display:flex;gap:12px;align-items:center">
    <span style="width:40px;height:40px;flex-shrink:0;border-radius:999px;background:#4338CA;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px">99</span>
    <span style="flex:1;font-size:14px;line-height:1.45;color:#D4D4D8">"Do them in any order. All six take about ten minutes."<br><span style="font-size:12px;color:#A1A1AA">Future You · Lv 99</span></span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <sc-for list="{{chapters}}" as="c" hint-placeholder-count="6">
      <a href="{{c.href}}" style="border-radius:16px;padding:14px;background:{{c.bg}};border:1px solid {{c.border}};display:flex;flex-direction:column;gap:8px;min-height:120px;box-sizing:border-box">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="width:36px;height:36px;border-radius:11px;background:{{c.iconBg}};display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="{{c.icon}}" size="18" color="{{c.iconFg}}" hint-size="18px,18px"></dc-import></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{c.stateFg}}">{{c.state}}</span>
        </div>
        <span style="font-size:15px;font-weight:600">{{c.title}}</span>
        <span style="font-size:12px;line-height:1.4;color:#A1A1AA">{{c.lesson}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:12px;font-weight:600;color:#A1A1AA;letter-spacing:0.04em">FIRST QUESTS · NO DEADLINE</span>
    <sc-for list="{{quests}}" as="q" hint-placeholder-count="4">
      <a href="Quests.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#16161B;border:1px solid #22222A">
        <dc-import name="Icon" icon="{{q.icon}}" size="18" color="#C7CBFF" hint-size="18px,18px"></dc-import>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">{{q.name}}</span><span style="font-size:12px;color:#A1A1AA">{{q.meta}}</span></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#86EFAC">{{q.reward}}</span>
      </a>
    </sc-for>
  </div>

  <div style="flex:1"></div>
  <a href="TutFinale.dc.html" style="min-height:48px;border-radius:14px;border:1px dashed #3F3F46;color:#A1A1AA;display:flex;align-items:center;justify-content:center;font-size:13px">Prototype: jump to Training complete</a>
  <a href="Main.dc.html" style="text-align:center;font-size:14px;color:#A1A1AA;min-height:32px">Skip training · replay any time in Settings</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['status', 'Status tour', 'Read your character sheet', 'done'],
      ['str', 'Prove it', '30-sec push-up Trial', 'done'],
      ['focus', 'Lock in', '2-min focus session', 'done'],
      ['wil', 'Make it automatic', 'Set up a verified habit', 'next'],
      ['target', 'Pick a path', 'Choose a target class', 'open'],
      ['treasury', 'Gear & data', 'To-do, expense, privacy', 'open']
    ];
    const chapters = list.map(([icon, title, lesson, st]) => {
      const done = st === 'done', next = st === 'next';
      return { icon: done ? 'check' : icon, title, lesson,
        href: 'TutIntro.dc.html',
        bg: next ? '#1E1E36' : '#16161B', border: next ? '#4338CA' : '#22222A',
        iconBg: done ? '#14532D' : (next ? '#4338CA' : '#26262E'), iconFg: done ? '#86EFAC' : '#FFFFFF',
        state: done ? 'Cleared' : (next ? '~2 min' : '~1 min'), stateFg: done ? '#86EFAC' : (next ? '#C7CBFF' : '#A1A1AA') };
    });
    const quests = [
      { icon: 'sleep', name: 'Pass your first habit check', meta: 'Tonight, automatically', reward: '+Rested' },
      { icon: 'agi', name: 'Touch grass', meta: 'Cooper run or a 20-min walk', reward: 'Badge' },
      { icon: 'wil', name: 'First 7-day streak', meta: 'Any verified activity', reward: 'Frame' },
      { icon: 'log', name: 'Read your first patch notes', meta: 'Next Monday', reward: '+Rested' }
    ];
    return { chapters, quests };
  }
}
</script>
</body>
</html>

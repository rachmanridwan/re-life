<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prologue — stat reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#FFFFFF}a:hover{color:#C7CBFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#111113;font-family:Inter,sans-serif;color:#F5F5F2;display:flex;flex-direction:column;gap:18px;padding:24px 20px 28px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#A1A1AA"><span>Prologue</span><span>Step 4 of 5</span></div>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px">
      <div style="height:4px;border-radius:2px;background:#F5F5F2"></div><div style="height:4px;border-radius:2px;background:#F5F5F2"></div><div style="height:4px;border-radius:2px;background:#F5F5F2"></div><div style="height:4px;border-radius:2px;background:#F5F5F2"></div><div style="height:4px;border-radius:2px;background:#3F3F46"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:30px;line-height:1.1">Your stats are in.</h1>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#A1A1AA">We read 214 days of your past activity. It already counts: <span style="color:#F5F5F2;font-weight:600">11,480 XP · Level 19</span>.</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
      <div style="border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;background:{{s.bg}};border:1px solid {{s.border}}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:0.04em;color:#D4D4D8"><dc-import name="Icon" icon="{{s.icon}}" size="16" color="{{s.ic}}" hint-size="16px,16px"></dc-import>{{s.key}}</span>
          <span style="font-size:10px;color:#A1A1AA">{{s.kind}}</span>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;color:{{s.valFg}}">{{s.val}}</span>
        <span style="font-size:11px;line-height:1.4;color:#A1A1AA">{{s.note}}</span>
      </div>
    </sc-for>
  </div>

  <div style="border-radius:16px;padding:14px;background:#1C1C22;display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;border-radius:12px;background:#4338CA;display:flex;align-items:center;justify-content:center">
      <dc-import name="Icon" icon="star" size="20" color="#FFFFFF" hint-size="20px,20px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:14px;font-weight:600">Unrated stats unlock in Placement Week</span>
      <span style="font-size:12px;color:#A1A1AA">Day 1 push-up Trial reveals STR</span>
    </div>
  </div>

  <div style="flex:1"></div>
  <a href="PrologueComplete.dc.html" style="min-height:52px;border-radius:16px;background:#F5F5F2;color:#111113;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { bg: '#1C1C22', border: '#2A2A31', valFg: '#F5F5F2', ic: '#C7CBFF' };
    const off = { bg: 'transparent', border: '#3F3F46', valFg: '#71717A', ic: '#71717A' };
    const stats = [
      { key: 'AGI', icon: 'agi', kind: 'measured', val: '48', note: '9.1k steps/day avg · VO₂ max 43', ...on },
      { key: 'VIT', icon: 'vit', kind: 'measured', val: '55', note: 'Sleep 7h 02m avg · watch', ...on },
      { key: 'DEX', icon: 'dex', kind: 'earned', val: '61', note: 'GitHub · 312 days active', ...on },
      { key: 'INT', icon: 'int', kind: 'earned', val: '39', note: 'Learning-app time · 90 days', ...on },
      { key: 'STR', icon: 'str', kind: 'measured', val: '??', note: 'Unrated · take the push-up Trial', ...off },
      { key: 'WIL', icon: 'wil', kind: 'earned', val: '??', note: 'Unrated · set 2 habits first', ...off }
    ];
    return { stats };
  }
}
</script>
</body>
</html>

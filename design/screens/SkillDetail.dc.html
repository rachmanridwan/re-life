<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skill detail — Programming</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F2}
a{color:inherit;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="width:390px;min-height:920px;box-sizing:border-box;background:#F5F5F2;font-family:Inter,sans-serif;color:#111113;display:flex;flex-direction:column;gap:12px;padding:16px 16px 24px">
  <div style="display:flex;align-items:center;gap:8px">
    <a href="Main.dc.html" aria-label="Back to status" style="width:44px;height:44px;border-radius:12px;border:1px solid #E4E4E0;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="back" size="20" hint-size="20px,20px"></dc-import></a>
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px">Skill</span>
  </div>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:14px">
      <span style="width:56px;height:56px;border-radius:16px;background:#111113;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="code" size="28" color="#FFFFFF" hint-size="28px,28px"></dc-import></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px">Programming</span>
        <span style="font-size:13px;color:#5E5E66">Lifetime · never decays</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:11px;color:#5E5E66;font-weight:600">LV</span><span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px">49</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:8px;border-radius:999px;background:#ECECE8;overflow:hidden"><div style="width:72%;height:100%;background:#111113"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#5E5E66"><span>To Lv 50</span><span style="font-family:'JetBrains Mono',monospace">2,140 XP left</span></div>
    </div>
    <div style="display:flex;gap:8px">
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#EEF7F5;color:#115E59"><dc-import name="Icon" icon="dex" size="14" color="#115E59" hint-size="14px,14px"></dc-import>DEX 60%</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#EEF7F5;color:#115E59"><dc-import name="Icon" icon="int" size="14" color="#115E59" hint-size="14px,14px"></dc-import>INT 40%</span>
    </div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px">Last 14 days</h2><span style="font-size:12px;color:#5E5E66;font-family:'JetBrains Mono',monospace">+6,820 XP</span></div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:90px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
        <div style="flex:1;border-radius:4px;background:{{b.bg}};height:{{b.h}}"></div>
      </sc-for>
    </div>
    <span style="font-size:12px;color:#5E5E66">Soft daily curve: hour 1 earns full XP, hour 6 earns about half.</span>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px">
    <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px">Sources</h2>
    <div style="display:flex;align-items:center;gap:10px"><dc-import name="Icon" icon="timer" size="18" hint-size="18px,18px"></dc-import><span style="flex:1;font-size:14px">WakaTime · active coding time</span><span style="font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;background:#EEF0FF;color:#3730A3">Platform</span></div>
    <div style="display:flex;align-items:center;gap:10px"><dc-import name="Icon" icon="git" size="18" hint-size="18px,18px"></dc-import><span style="flex:1;font-size:14px">GitHub · merged PRs, reviews</span><span style="font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;background:#EEF0FF;color:#3730A3">Platform</span></div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E4E4E0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px">
    <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px">Milestones</h2>
    <sc-for list="{{miles}}" as="m" hint-placeholder-count="3">
      <a href="Classes.dc.html" style="display:flex;align-items:center;gap:10px;min-height:44px">
        <span style="width:32px;height:32px;border-radius:10px;background:{{m.bg}};display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="{{m.icon}}" size="16" color="{{m.fg}}" hint-size="16px,16px"></dc-import></span>
        <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500">{{m.name}}</span><span style="font-size:12px;color:#5E5E66">{{m.meta}}</span></span>
        <dc-import name="Icon" icon="chevron" size="16" color="#8A8A92" hint-size="16px,16px"></dc-import>
      </a>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const v = [40, 62, 55, 0, 30, 70, 85, 48, 66, 20, 0, 74, 90, 58];
    const bars = v.map(x => ({ h: Math.max(x, 4) + '%', bg: x ? '#111113' : '#ECECE8' }));
    const miles = [
      { icon: 'check', name: 'Lv 30 · Grinder Builder', meta: 'Unlocked 12 Aug', bg: '#ECFDF3', fg: '#166534' },
      { icon: 'lock', name: 'Lv 50 · Locked In Builder', meta: 'Also needs DEX 60 + WIL 50', bg: '#F5F5F2', fg: '#5E5E66' },
      { icon: 'lock', name: 'Lv 75 · Cracked Builder', meta: 'DEX 75 + WIL 70', bg: '#F5F5F2', fg: '#5E5E66' }
    ];
    return { bars, miles };
  }
}
</script>
</body>
</html>
